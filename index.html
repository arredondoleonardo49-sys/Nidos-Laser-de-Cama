<!doctype html>
<html lang="es">
<head>

<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1c1f1a; --muted:#6b7166; --line:#dfe2da;
  --accent:#2f7d32; --accent-ink:#ffffff; --corte:#1f9d3a; --marca:#d4a20a;
  --ok:#2f7d32; --ok-bg:#e6f2e4; --warn:#9a6a00; --warn-bg:#fbf1d6; --err:#b3261e; --err-bg:#fbe5e2;
  --info:#55606b; --info-bg:#eceff1; --chip:#eef0ea; --shadow:0 1px 2px rgba(0,0,0,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141612; --panel:#1d201b; --ink:#e7eae3; --muted:#9aa194; --line:#30352d;
    --accent:#5dbb63; --accent-ink:#0d1a0e; --corte:#4cd068; --marca:#f2c230;
    --ok:#7fd086; --ok-bg:#1d3320; --warn:#f0c35a; --warn-bg:#3a2f12; --err:#ff8a80; --err-bg:#3d1c19;
    --info:#b7c0c8; --info-bg:#262b30; --chip:#272b24; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141612; --panel:#1d201b; --ink:#e7eae3; --muted:#9aa194; --line:#30352d;
  --accent:#5dbb63; --accent-ink:#0d1a0e; --corte:#4cd068; --marca:#f2c230;
  --ok:#7fd086; --ok-bg:#1d3320; --warn:#f0c35a; --warn-bg:#3a2f12; --err:#ff8a80; --err-bg:#3d1c19;
  --info:#b7c0c8; --info-bg:#262b30; --chip:#272b24; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header h1 small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.4px;text-transform:uppercase}
.logo{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:800}
.sp{flex:1}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--muted)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=password]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:100%}
main{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:12px}
details.card>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:8px;font-weight:600}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.card[open]>summary::before{transform:rotate(90deg)}
details.card>summary .sub{font-weight:400;color:var(--muted);font-size:12.5px}
.body{padding:0 14px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.err .v{color:var(--err)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tab{border:none;background:none;padding:9px 12px;border-bottom:2px solid transparent;border-radius:0;color:var(--muted)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font-size:11px;background:var(--chip);padding:1px 6px;border-radius:9px;margin-left:2px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;background:var(--panel);position:sticky;top:0}
td.num,th.num{text-align:right}
.tw{overflow-x:auto}
.st{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.warn{background:var(--warn-bg);color:var(--warn)}
.st.err{background:var(--err-bg);color:var(--err)} .st.info{background:var(--info-bg);color:var(--info)}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
tr.op{cursor:pointer} tr.op:hover td{background:var(--chip)}
tr.det>td{background:var(--bg);padding:10px}
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}

.pc .t{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.pc .m{font-size:12px;color:var(--muted)}
.iss{margin:0;padding:0;list-style:none;font-size:12.5px}
.iss li{padding:2px 0}
.iss li.err{color:var(--err)} .iss li.warn{color:var(--warn)}
.chip{display:inline-block;white-space:nowrap;background:var(--chip);border-radius:5px;padding:1px 6px;font-size:11.5px;margin-right:3px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
#estado{font-size:12.5px;color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.leg{display:flex;gap:12px;font-size:12px;color:var(--muted);align-items:center}
.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;max-width:min(980px,96vw);width:96vw}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
dialog .cv{height:min(70vh,640px);display:grid;place-items:center;background:var(--bg)}
dialog .cv svg{max-width:96%;max-height:96%}
dialog .ft{padding:10px 14px;font-size:12.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.hide{display:none!important}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
</style>

<body>
<header>
  <div class="logo">N</div>
  <h1><small>Línea Italia · Láser de cama</small>Nidos de corte · Validador de biblioteca</h1>
  <span class="sp"></span>
  <span id="estado"></span>
  <label class="btn" title="Cargar programa de producción (Excel de BC)">📄 Programa<input id="fProg" type="file" accept=".xlsx,.xls" hidden></label>
  <button id="bLeer" class="pri" title="Leer la biblioteca de Drive y validar los dibujos del programa">🔄 Leer biblioteca</button>
  <button id="bTema" title="Tema claro/oscuro">🌓</button>
</header>
<main>
  <details class="card" id="cfgCard">
    <summary>⚙️ Conexión <span class="sub" id="cfgSub">sin configurar</span></summary>
    <div class="body">
      <div class="grid2">
        <div><label class="f">URL de la aplicación web de Apps Script (termina en /exec)</label><input id="iUrl" type="text" placeholder="https://script.google.com/macros/s/…/exec"></div>
        <div><label class="f">Token (solo si lo configuraste en el script)</label><input id="iTok" type="password" placeholder="opcional"></div>
      </div>
      <div class="toolbar" style="margin-top:10px;margin-bottom:0">
        <button id="bPing">🔌 Probar conexión</button>
        <label class="btn" title="Probar sin Drive: selecciona archivos .dxf o .dxf.gz de tu equipo">📁 Modo local (archivos)<input id="fLocal" type="file" accept=".dxf,.gz" multiple hidden></label>
        <button id="bCache" title="Borrar los dibujos guardados en este navegador">🧹 Limpiar caché</button>
        <span class="muted" id="pingRes"></span>
      </div>
      <p class="note">Los dibujos descargados se guardan en este navegador y solo se vuelven a bajar cuando Ingeniería los modifica en Drive.</p>
    </div>
  </details>

  <details class="card hide" id="capCard">
    <summary>🗂️ Capas detectadas <span class="sub" id="capSub"></span></summary>
    <div class="body" id="capBody"></div>
  </details>

  <div id="prog" class="hide card" style="padding:10px 14px"><div id="progTxt" class="muted">…</div><div class="bar"><i id="progBar"></i></div></div>

  <div id="kpis" class="kpis"></div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-t="ops">📋 Programa <span class="n" id="nOps">0</span></button>
    <button class="tab" data-t="exp">⚖️ Explosión por calibre</button>
    <button class="tab" data-t="con">📦 Consumo por OP</button>
    <button class="tab" data-t="pen">🛠️ Pendientes Ingeniería <span class="n" id="nPen">0</span></button>
    <button class="tab" data-t="bib">📚 Biblioteca <span class="n" id="nBib">0</span></button>
  </div>

  <section id="t-ops"></section>
  <section id="t-exp" class="hide"></section>
  <section id="t-con" class="hide"></section>
  <section id="t-pen" class="hide"></section>
  <section id="t-bib" class="hide"></section>
</main>

<dialog id="dlg">
  <div class="hd"><b id="dlgT"></b><span class="sp"></span><span class="leg"><span><i style="background:var(--corte)"></i>CORTE</span><span><i style="background:var(--marca)"></i>MARCA</span><span><i style="background:var(--err)"></i>Error</span></span><button id="dlgX">✕</button></div>
  <div class="cv" id="dlgC"></div>
  <div class="ft" id="dlgF"></div>
</dialog>

<script>
"use strict";
/* ============================== CONFIGURACIÓN ============================== */
const LAMINA = { W: 1219.2, H: 3048 };                 // 4 × 10 ft en mm
const AREA_HOJA = LAMINA.W * LAMINA.H / 1e6;          // m²
const DENS = 7.85;                                    // kg/dm³ acero
const ESPESOR = { 10:3.42, 11:3.04, 12:2.66, 13:2.28, 14:1.90, 16:1.52, 18:1.21, 20:0.91, 22:0.76, 24:0.61 }; // mm, lámina negra
const CAL_MIN = 12, CAL_MAX = 24;
const CAPAS = { CORTE: 3, MARCA: 2 };                 // nombre → color ACI esperado
const TOL = 0.05;                                     // mm, unión de extremos
const LOTE = 20;                                      // archivos por petición
const URL_DEFAULT = "https://script.google.com/macros/s/AKfycbyM9Stpc1fB97aRf0o5TTmu2KkD-5Zp-ZmXrezbN150RX1PpAAbO5kphlnixiob7wLf/exec";

/* ============================== UTILIDADES ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (n, d = 0) => Number(n).toLocaleString("es-MX", { minimumFractionDigits: d, maximumFractionDigits: d });
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toUpperCase();
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
function estado(t) { $("#estado").textContent = t || ""; }
function progreso(txt, frac) {
  const p = $("#prog");
  if (txt == null) { p.classList.add("hide"); return; }
  p.classList.remove("hide"); $("#progTxt").textContent = txt; $("#progBar").style.width = Math.round((frac || 0) * 100) + "%";
}

/* ============================== ESTADO ============================== */
const S = {
  programa: null,        // {nombre, ops:[{op, ruta, desc, cant, inicio, cod}]}
  biblio: null,          // {origen, raiz, generado, rutas: Map(rutaNorm → {ruta, tieneLamina, archivos:[meta]})}
  analisis: new Map(),   // fileId → resultado
  local: new Map(),      // fileId → bytes (modo local)
  metas: new Map(),      // fileId → meta de los archivos revisados
};

/* ============================== CACHÉ (IndexedDB) ============================== */
const idb = (() => {
  let dbp = null;
  function db() {
    if (!dbp) dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open("nidos-laser", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("dxf");
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function tx(mode, fn) {
    try { const d = await db(); return await new Promise((res, rej) => { const t = d.transaction("dxf", mode); const r = fn(t.objectStore("dxf")); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); }
    catch { return undefined; }
  }
  return {
    get: k => tx("readonly", s => s.get(k)),
    put: (k, v) => tx("readwrite", s => s.put(v, k)),
    clear: () => tx("readwrite", s => s.clear()),
  };
})();

/* ============================== JSONP ============================== */
let jsonpN = 0;
function jsonp(params, timeoutMs = 180000) {
  const url = (ls.get("nl_url", "") || URL_DEFAULT).trim();
  if (!url) return Promise.reject(new Error("Configura la URL del Apps Script en ⚙️ Conexión"));
  const tok = ls.get("nl_tok", "");
  return new Promise((res, rej) => {
    const cb = "__nl" + (++jsonpN) + "_" + Date.now();
    const q = new URLSearchParams({ ...params, callback: cb }); if (tok) q.set("token", tok);
    const sc = document.createElement("script");
    const onErr = ev => { if (ev.filename && ev.filename.indexOf(cb) >= 0) { fin(); rej(new Error("Google respondió con una página en lugar de datos. Revisa que la implementación tenga acceso \"Cualquier usuario\" y que hayas autorizado el script ejecutando \"probar\" en el editor.")); } };
    window.addEventListener("error", onErr);
    const fin = () => { delete window[cb]; sc.remove(); clearTimeout(to); window.removeEventListener("error", onErr); };
    const to = setTimeout(() => { fin(); rej(new Error("Sin respuesta de Apps Script después de " + Math.round(timeoutMs / 1000) + " s. Si es la primera lectura, agrega el servicio \"Drive API\" al script (lo hace mucho más rápido) o ejecuta \"probar\" en el editor y vuelve a intentar.")); }, timeoutMs);
    window[cb] = d => { fin(); d && d.ok ? res(d) : rej(new Error((d && d.error) || "Respuesta inválida")); };
    sc.onerror = () => { fin(); rej(new Error("No se pudo contactar el Apps Script. Revisa la URL y que esté implementado con acceso 'Cualquier usuario'.")); };
    sc.src = url + (url.includes("?") ? "&" : "?") + q.toString();
    document.head.appendChild(sc);
  });
}

/* ============================== DESCOMPRESIÓN ============================== */
const b64ToBytes = b64 => { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
async function gunzipTodo(bytes) {
  let b = bytes, capas = 0;
  while (b.length > 2 && b[0] === 0x1f && b[1] === 0x8b) {
    if (typeof DecompressionStream === "undefined") throw new Error("Este navegador no puede descomprimir .gz (usa Chrome o Edge actualizados)");
    const ds = new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"));
    b = new Uint8Array(await new Response(ds).arrayBuffer());
    if (++capas > 5) throw new Error("Compresión anidada inválida");
  }
  return { bytes: b, capas };
}
function bytesATexto(b) {
  let t = new TextDecoder("utf-8").decode(b);
  if (t.includes("�")) t = new TextDecoder("windows-1252").decode(b);
  return t;
}

/* ============================== LECTURA DXF ============================== */
function parseDXF(txt) {
  if (/^AutoCAD Binary DXF/.test(txt)) throw new Error("DXF binario no soportado: guardar como DXF ASCII");
  const L = txt.split(/\r\n|\r|\n/);
  const P = [];
  for (let i = 0; i + 1 < L.length; i += 2) {
    const c = parseInt(L[i].trim(), 10);
    if (Number.isNaN(c)) continue;
    P.push([c, L[i + 1].replace(/\s+$/, "")]);
  }
  if (!P.length) throw new Error("Archivo vacío o no es DXF");
  const out = { insunits: null, version: null, capas: {}, ents: [], bloques: 0 };
  let sec = null, i = 0;
  while (i < P.length) {
    const [c, v] = P[i];
    if (c === 0 && v === "SECTION") { sec = P[i + 1] && P[i + 1][1]; i += 2; continue; }
    if (c === 0 && v === "ENDSEC") { sec = null; i++; continue; }
    if (sec === "HEADER" && c === 9) {
      if (v === "$INSUNITS") out.insunits = parseInt(P[i + 1][1], 10);
      if (v === "$ACADVER") out.version = P[i + 1][1].trim();
      i += 2; continue;
    }
    if (sec === "TABLES" && c === 0 && v === "LAYER") {
      let j = i + 1, nombre = null, color = 7;
      while (j < P.length && P[j][0] !== 0) { if (P[j][0] === 2) nombre = P[j][1].trim(); if (P[j][0] === 62) color = parseInt(P[j][1], 10); j++; }
      if (nombre != null) out.capas[nombre] = { color: Math.abs(color), apagada: color < 0 };
      i = j; continue;
    }
    if (sec === "BLOCKS" && c === 0 && v === "BLOCK") out.bloques++;
    if (sec === "ENTITIES" && c === 0) {
      const tipo = v.trim(); let j = i + 1; const raw = [];
      while (j < P.length && P[j][0] !== 0) { raw.push(P[j]); j++; }
      const e = { tipo, raw };
      if (tipo === "POLYLINE") {
        e.vert = [];
        while (j < P.length && P[j][0] === 0 && P[j][1].trim() === "VERTEX") {
          let k = j + 1; const vr = [];
          while (k < P.length && P[k][0] !== 0) { vr.push(P[k]); k++; }
          e.vert.push(vr); j = k;
        }
        if (j < P.length && P[j][1].trim() === "SEQEND") { j++; while (j < P.length && P[j][0] !== 0) j++; }
      }
      if (tipo !== "SEQEND" && tipo !== "ENDSEC") out.ents.push(e);
      i = j; continue;
    }
    i++;
  }
  for (const e of out.ents) {
    const g = c => { const p = e.raw.find(x => x[0] === c); return p ? p[1] : undefined; };
    e.capa = (g(8) ?? "0").trim();
    const col = g(62); e.color = col == null ? 256 : parseInt(col, 10);
    e.trueColor = g(420) != null;
    e.extrZ = parseFloat(g(230) ?? "1");
  }
  return out;
}

/* ---------- geometría ---------- */
const num = (raw, c, d = 0) => { const p = raw.find(x => x[0] === c); return p ? parseFloat(p[1]) : d; };
function arcoPts(cx, cy, r, a0, a1) {           // grados, sentido antihorario
  let da = a1 - a0; while (da <= 0) da += 360; if (da > 360) da = 360;
  const n = Math.max(4, Math.ceil(da / 4));
  const pts = [];
  for (let k = 0; k <= n; k++) { const a = (a0 + da * k / n) * Math.PI / 180; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return pts;
}
function bulgePts(p0, p1, b) {
  if (!b) return [p0, p1];
  const th = 4 * Math.atan(b), dx = p1[0] - p0[0], dy = p1[1] - p0[1], c = Math.hypot(dx, dy);
  if (c < 1e-9) return [p0, p1];
  const r = c / (2 * Math.sin(th / 2)), mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
  const h = r * Math.cos(th / 2), ux = -dy / c, uy = dx / c;
  const cx = mx + ux * h, cy = my + uy * h;
  const a0 = Math.atan2(p0[1] - cy, p0[0] - cx);
  const n = Math.max(2, Math.ceil(Math.abs(th) * 180 / Math.PI / 4)), R = Math.abs(r), pts = [];
  for (let k = 0; k <= n; k++) { const a = a0 + th * k / n; pts.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]); }
  pts[0] = p0; pts[pts.length - 1] = p1;
  return pts;
}
function nurbs(ctrl, knots, w, deg, nSeg) {
  const n = ctrl.length;
  if (n < 2) return ctrl.slice();
  if (!knots || knots.length !== n + deg + 1) {   // nudos uniformes cerrados
    knots = []; for (let k = 0; k < n + deg + 1; k++) knots.push(k <= deg ? 0 : k >= n ? n - deg : k - deg);

/** Analiza un DXF ya parseado contra la convención */
function analizar(dxf) {
  const errores = [], avisos = [];

  else if (dxf.insunits != null && dxf.insunits !== 4 && dxf.insunits !== 0) add(avisos, "Unidades del dibujo no son mm ($INSUNITS=" + dxf.insunits + ")");

      else add(errores, `${pl.motivo} en capa "${e.capa}"`);

    const k = claveEnt(e, pl);

  const roles = rolesUsuario();
  const capas = [...porCapa.entries()].map(([nombre, ents]) => {
    const u = roles[norm(nombre)];
    const rol = u && u !== "auto" ? u : norm(nombre) === "CORTE" ? "corte" : norm(nombre) === "MARCA" ? "marca" : null;
    return { nombre, ents, rol, origen: u && u !== "auto" ? "manual" : rol ? "nombre" : "auto", color: dxf.capas[nombre] ? dxf.capas[nombre].color : null };
  });

/* ============================== NOMBRES DE ARCHIVO ============================== */
const RX_NOMBRE = /^(.+?)_(\d+)\s*PZ[AS]*_([A-Z0-9.]+)_(?:CAL\s*(\d+)_)?(.+?)(?:[ _]+V(\d+))?(?:[ _]*\(?(\d{4}-\d{2}-\d{2})\)?)?\.DXF(?:\.GZ)*$/i;
function leerNombre(nombre) {
  const m = String(nombre).trim().match(RX_NOMBRE);
  if (!m) return null;
  return { prefijo: m[1].trim(), pz: parseInt(m[2], 10), material: m[3].toUpperCase(), cal: m[4] ? parseInt(m[4], 10) : null,
           pieza: m[5].trim().toUpperCase(), version: m[6] ? parseInt(m[6], 10) : null, fecha: m[7] || null };
}

/** Clasifica los archivos de una ruta: vigentes, respaldos, problemas de nombre */
function clasificarRuta(r) {
  const vig = [], resp = [], prob = [];
  const grupos = new Map();
  for (const a of r.archivos) {
    if (!/\.dxf(\.gz)*$/i.test(a.nombre)) { prob.push({ a, sev: "info", txt: "No es DXF; se ignora" }); continue; }
    if (/subiendo/i.test(a.nombre)) { prob.push({ a, sev: "info", txt: "Carga incompleta \"(subiendo)\"; se ignora" }); continue; }
    const n = leerNombre(a.nombre);
    if (!n) { prob.push({ a, sev: "err", txt: "El nombre no sigue la convención RUTA_NPZAS_LAMINA_CALxx_PIEZA vN (fecha)" }); continue; }
    if (n.material !== "LAMINA") { prob.push({ a, sev: "warn", txt: `Material ${n.material} dentro de "DXF de lámina"; se ignora` }); continue; }
    if (n.version == null) { prob.push({ a, sev: "err", txt: "Sin número de versión (vN); no se usa" }); continue; }
    a.n = n;
    const k = norm(n.pieza);
    if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(a);
  }
  for (const [, arr] of grupos) {
    arr.sort((x, y) => y.n.version - x.n.version || String(y.n.fecha || "").localeCompare(String(x.n.fecha || "")) || String(y.mod || "").localeCompare(String(x.mod || "")));
    const v = arr[0]; v.avisosNombre = [];
    const empatados = arr.filter(x => x.n.version === v.n.version);
    if (empatados.length > 1) v.avisosNombre.push(`Hay ${empatados.length} archivos v${v.n.version} de esta pieza; se tomó el de fecha más reciente (${v.n.fecha || "sin fecha"}). Confirmar con Ingeniería`);
    if (norm(v.n.prefijo) !== norm(r.ruta)) v.avisosNombre.push(`El nombre empieza con "${v.n.prefijo}" pero está en la carpeta "${r.ruta}"`);
    if (v.n.cal == null) v.avisosNombre.push("ERR:Sin calibre en el nombre (CALxx)");
    else if (v.n.cal < CAL_MIN || v.n.cal > CAL_MAX) v.avisosNombre.push(`Calibre ${v.n.cal} fuera del rango ${CAL_MIN}–${CAL_MAX}`);
    vig.push(v); resp.push(...arr.slice(1));

}

/* ============================== PROGRAMA DE PRODUCCIÓN ============================== */
function leerPrograma(buf, nombre) {
  if (typeof XLSX === "undefined") throw new Error("No se cargó la librería de Excel (revisa la conexión a internet)");
  const wb = XLSX.read(buf, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const filas = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
  const hi = filas.findIndex(f => f && f.some(c => norm(c) === "N RUTA" || norm(c) === "NO RUTA" || norm(c) === "Nº RUTA".normalize("NFD")) );
  const idxH = hi >= 0 ? hi : filas.findIndex(f => f && f.some(c => /RUTA/.test(norm(c))));
  if (idxH < 0) throw new Error("No encontré la columna 'Nº ruta' en el archivo");
  const H = filas[idxH].map(norm);
  const col = (...pats) => H.findIndex(h => pats.some(p => p.test(h)));
  const cRuta = col(/^N.? ?RUTA$/, /RUTA/), cOp = col(/^N.?$/, /^NO\.?$/, /^N[º°O]$/), cCant = col(/^CANTIDAD$/),
        cDesc = col(/^DESCRIPCION$/), cIni = col(/FECHA-HORA INICIAL/, /INICIAL/), cCod = col(/PROCEDENCIA/);
  if (cCant < 0) throw new Error("No encontré la columna 'Cantidad'");
  const ops = [];
  for (const f of filas.slice(idxH + 1)) {
    if (!f) continue;
    const ruta = f[cRuta]; const cant = Number(f[cCant]);
    if (ruta == null || ruta === "" || !cant) continue;
    let ini = cIni >= 0 ? f[cIni] : null;
    if (typeof ini === "number") { const d = XLSX.SSF.parse_date_code(ini); ini = d ? new Date(d.y, d.m - 1, d.d, d.H, d.M, Math.round(d.S)) : null; }
    ops.push({ op: cOp >= 0 ? String(f[cOp] ?? "") : "", ruta: String(ruta).trim().replace(/\.0+$/, ""), cant,
               desc: cDesc >= 0 ? String(f[cDesc] ?? "").trim() : "", cod: cCod >= 0 ? String(f[cCod] ?? "") : "",
               inicio: ini instanceof Date && !isNaN(ini) ? ini : null });
  }
  if (!ops.length) throw new Error("El programa no tiene OPs con ruta y cantidad");
  ops.sort((a, b) => (a.inicio ? a.inicio.getTime() : Infinity) - (b.inicio ? b.inicio.getTime() : Infinity));
  return { nombre, ops };
}

/* ============================== CARGA DE BIBLIOTECA ============================== */
async function cargarListado(refrescar) {
  const t0 = Date.now(), reloj = setInterval(() => progreso(`Leyendo la biblioteca en Drive… ${Math.round((Date.now() - t0) / 1000)} s`, 0.05), 1000);
  let d; try { d = await jsonp({ accion: "listar", refrescar: refrescar ? "1" : "0" }, 360000); } finally { clearInterval(reloj); }
  const rutas = new Map();
  for (const r of d.rutas) rutas.set(norm(r.ruta), { ruta: r.ruta, tieneLamina: !!r.tieneLamina, archivos: r.archivos || [] });
  S.biblio = { origen: "drive", raiz: d.raiz, generado: d.generado, desdeCache: !!d.desdeCache, rutas };
  for (const r of rutas.values()) r.clas = clasificarRuta(r);
}

async function obtenerTexto(meta) {
  const clave = meta.id;
  if (S.biblio.origen === "local") return bytesATexto((await gunzipTodo(S.local.get(clave))).bytes);
  const c = await idb.get(clave);
  if (c && c.mod === meta.mod && c.txt) return c.txt;
  return null;
}

/** Descarga y analiza una lista de archivos vigentes */
async function analizarArchivos(metas, etiqueta) {
  for (const m of metas) S.metas.set(m.id, m);
  const faltan = metas.filter(m => !S.analisis.has(m.id));
  let hechos = 0;
  const total = faltan.length;
  const paso = () => progreso(`${etiqueta}: ${hechos} de ${total} dibujos`, total ? hechos / total : 1);
  paso();
  const porBajar = [];
  for (const m of faltan) {
    const t = await obtenerTexto(m);
    if (t != null) { S.analisis.set(m.id, analizarTexto(t, m)); hechos++; paso(); }
    else porBajar.push(m);
  }
  for (let k = 0; k < porBajar.length; k += LOTE) {
    const lote = porBajar.slice(k, k + LOTE);
    let d;
    try { d = await jsonp({ accion: "archivos", ids: lote.map(m => m.id).join(",") }); }
    catch (e) { for (const m of lote) S.analisis.set(m.id, { errores: ["No se pudo descargar: " + e.message], avisos: [], fallo: true }); hechos += lote.length; paso(); continue; }
    for (const m of lote) {
      const f = d.files && d.files[m.id];
      if (!f) { S.analisis.set(m.id, { errores: ["No se pudo descargar: " + ((d.errores && d.errores[m.id]) || "sin respuesta")], avisos: [], fallo: true }); }
      else {
        try {
          const { bytes } = await gunzipTodo(b64ToBytes(f.b64));
          const txt = bytesATexto(bytes);
          idb.put(m.id, { mod: m.mod, txt });
          S.analisis.set(m.id, analizarTexto(txt, m));
        } catch (e) { S.analisis.set(m.id, { errores: [e.message], avisos: [], fallo: true }); }
      }
      hechos++; paso();
    }
  }
  progreso(null);
}
function analizarTexto(txt, meta) {
  try { const dxf = parseDXF(txt); const r = analizar(dxf); r.version = dxf.version; return r; }
  catch (e) { return { errores: ["No se pudo leer el DXF: " + e.message], avisos: [], fallo: true }; }
}

/** Resultado completo de una pieza vigente = análisis del dibujo + avisos del nombre */
function resultadoPieza(meta) {
  const a = S.analisis.get(meta.id) || { errores: [], avisos: [], pendiente: true };
  const errores = [...a.errores], avisos = [...a.avisos];
  for (const t of meta.avisosNombre || []) t.startsWith("ERR:") ? errores.push(t.slice(4)) : avisos.push(t);
  const sev = a.pendiente ? "info" : errores.length ? "err" : avisos.length ? "warn" : "ok";
  return { ...a, errores, avisos, sev };
}

/* ============================== EVALUACIÓN DEL PROGRAMA ============================== */
function evaluarPrograma() {
  if (!S.programa || !S.biblio) return null;
  const filas = [];
  for (const op of S.programa.ops) {
    const r = S.biblio.rutas.get(norm(op.ruta));
    const f = { op, r, piezas: [], sev: "info", etiqueta: "" };
    if (!r) { f.estado = "sincarpeta"; f.etiqueta = "Sin carpeta"; }
    else if (!r.clas.vig.length) { f.estado = "sinlamina"; f.etiqueta = r.tieneLamina ? "Carpeta de lámina vacía" : "Sin dibujos de lámina"; }
    else {
      f.piezas = r.clas.vig.map(m => ({ meta: m, res: resultadoPieza(m), total: m.n.pz * op.cant }));
      const s = f.piezas.map(p => p.res.sev);
      f.sev = s.includes("err") ? "err" : s.includes("info") ? "info" : s.includes("warn") ? "warn" : "ok";
      f.estado = f.sev; f.etiqueta = { err: "Con errores", warn: "Lista con avisos", ok: "Lista", info: "Sin validar" }[f.sev];
    }
    filas.push(f);
  }
  return filas;
}

const ICON = { ok: "✅", warn: "⚠️", err: "❌", info: "⏳", sincarpeta: "📂", sinlamina: "⚪" };

function svgPieza(res, grande) {
  const d = res && res.dibujo;
  if (!d || !res.bbox) return `<span class="muted">sin vista</span>`;
  const [x0, y0, x1, y1] = res.bbox, w = Math.max(x1 - x0, 1), h = Math.max(y1 - y0, 1), m = Math.max(w, h) * 0.04;
  const sw = Math.max(w, h) / (grande ? 700 : 220);
  const path = (pts, cerr) => "M" + pts.map(p => (p[0] - x0 + m).toFixed(2) + " " + (y1 - p[1] + m).toFixed(2)).join("L") + (cerr ? "Z" : "");
  let s = `<svg viewBox="0 0 ${(w + 2 * m).toFixed(1)} ${(h + 2 * m).toFixed(1)}" xmlns="http://www.w3.org/2000/svg" style="width:${grande ? "100%" : "auto"};height:${grande ? "100%" : "140px"}">`;
  s += `<g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="${(sw * 1.4).toFixed(3)}">`;
  for (const p of d.corte) s += `<path d="${path(p, true)}" stroke="var(--corte)"/>`;
  for (const p of d.sinCapa || []) s += `<path d="${path(p, false)}" stroke="var(--err)" stroke-dasharray="${sw * 6} ${sw * 4}"/>`;
  for (const p of d.marca) s += `<path d="${path(p.pts, p.cerrada)}" stroke="var(--marca)"/>`;
  for (const p of (d.corte.length ? d.abiertos : [])) {
    s += `<path d="${path(p, false)}" stroke="var(--err)" stroke-width="${(sw * 3).toFixed(3)}"/>`;
    for (const q of [p[0], p[p.length - 1]]) s += `<circle cx="${(q[0] - x0 + m).toFixed(2)}" cy="${(y1 - q[1] + m).toFixed(2)}" r="${(sw * 8).toFixed(2)}" stroke="var(--err)" stroke-width="${(sw * 2).toFixed(3)}"/>`;
  }
  return s + "</g></svg>";
}

function tarjetaPieza(meta, res, total) {
  const iss = res.errores.map(t => `<li class="err">❌ ${esc(t)}</li>`).concat(res.avisos.map(t => `<li class="warn">⚠️ ${esc(t)}</li>`)).join("");
  const dims = res.bbox ? `${fmt(res.ancho, 1)} × ${fmt(res.alto, 1)} mm` : "—";
  return `<div class="pc">
    <div class="t"><span>${esc(meta.n.pieza)}</span>${chipEstado(res.sev, { ok: "OK", warn: "Aviso", err: "Error", info: "Pendiente" }[res.sev])}</div>
    <div class="pv" data-id="${esc(meta.id)}">${svgPieza(res)}</div>
    <div class="m"><span class="chip">CAL ${meta.n.cal ?? "?"}</span><span class="chip">${meta.n.pz} pz/mueble</span><span class="chip">v${meta.n.version}</span>${total != null ? `<span class="chip"><b>${fmt(total)} pz</b></span>` : ""}</div>
    <div class="m">${dims}${res.area ? ` · ${fmt(res.area * 100, 2)} dm² netos · corte ${fmt(res.perimCorte / 1000, 2)} m` : ""}${res.largoMarca ? ` · marca ${fmt(res.largoMarca / 1000, 2)} m` : ""}</div>
    ${res.capas && res.capas.length ? `<div class="m">${res.capas.map(c => `<span class="chip" title="${c.n} entidades · ${c.origen === "auto" ? "detectado automático" : c.origen === "manual" ? "definido por ti" : "por nombre"}" style="border-left:3px solid ${c.rol === "corte" ? "var(--corte)" : c.rol === "marca" ? "var(--marca)" : "var(--muted)"}">${esc(c.nombre)} → ${c.rol === "corte" ? "corte" : c.rol === "marca" ? "marca" : "ignorada"}${c.origen === "auto" ? " ·auto" : ""}</span>`).join("")}</div>` : ""}
    ${iss ? `<ul class="iss">${iss}</ul>` : ""}
    <div class="m mono" title="${esc(meta.nombre)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(meta.nombre)}</div>
  </div>`;
}

function explosion(filas) {
  const porCal = new Map();
  for (const f of filas || []) for (const p of f.piezas) {
    const c = p.meta.n.cal ?? "?";
    if (!porCal.has(c)) porCal.set(c, { cal: c, piezas: 0, area: 0, refs: new Set(), ops: new Set(), errores: 0, corte: 0, marca: 0 });
    const g = porCal.get(c);
    g.piezas += p.total; g.refs.add(p.meta.id); g.ops.add(f.op.op);
    if (p.res.sev === "err" || p.res.sev === "info") g.errores += p.total;
    else { g.area += (p.res.area || 0) * p.total; g.corte += (p.res.perimCorte || 0) * p.total; g.marca += (p.res.largoMarca || 0) * p.total; }
  }
  return [...porCal.values()].sort((a, b) => (a.cal === "?") - (b.cal === "?") || a.cal - b.cal);
}

  for (const g of E) {

      <td class="num">${fmt(g.area, 3)}</td><td class="num">${fmt(kg, 1)}</td><td class="num"><b>${fmt(hojas, 2)}</b> → ${fmt(Math.ceil(hojas - 1e-9))}</td><td class="num">${fmt(g.corte / 1000, 1)}</td><td class="muted">${nota}</td></tr>`;
  }

    <p class="note">Mínimo teórico = área neta de las piezas ÷ área de una hoja 4×10 (${fmt(AREA_HOJA, 3)} m²), sin separación ni esqueleto. El consumo real lo dará el motor de nidos en el siguiente paso. Kg con espesores nominales de lámina negra y densidad ${DENS}.</p>`;

function listaPendientes(filas) {
  const L = [];
  const b = S.biblio; if (!b) return L;
  const rutasProg = new Set((S.programa ? S.programa.ops : []).map(o => norm(o.ruta)));
  const vistos = new Set();
  const addPieza = (r, m) => {
    const res = resultadoPieza(m); if (res.pendiente) return;
    for (const t of res.errores) L.push({ sev: "err", ruta: r.ruta, archivo: m.nombre, txt: t, prog: rutasProg.has(norm(r.ruta)) });
    for (const t of res.avisos) L.push({ sev: "warn", ruta: r.ruta, archivo: m.nombre, txt: t, prog: rutasProg.has(norm(r.ruta)) });
  };
  for (const r of b.rutas.values()) {
    for (const m of r.clas.vig) { addPieza(r, m); vistos.add(m.id); }
    for (const p of r.clas.prob) if (p.sev !== "info") L.push({ sev: p.sev, ruta: r.ruta, archivo: p.a.nombre, txt: p.txt, prog: rutasProg.has(norm(r.ruta)) });
  }
  if (filas) {
    const ya = new Set();
    for (const f of filas) if ((f.estado === "sincarpeta" || f.estado === "sinlamina") && !ya.has(norm(f.op.ruta))) {
      ya.add(norm(f.op.ruta));
      L.push({ sev: "info", ruta: f.op.ruta, archivo: "", txt: (f.estado === "sincarpeta" ? "La ruta no tiene carpeta en la biblioteca" : "La carpeta no tiene dibujos de lámina") + " — confirmar si lleva piezas de láser", prog: true, desc: f.op.desc });
    }
  }
  const ord = { err: 0, warn: 1, info: 2 };
  return L.sort((a, b) => (b.prog - a.prog) || ord[a.sev] - ord[b.sev] || a.ruta.localeCompare(b.ruta));
}


function consumoPorOP(filas) {
  const out = [];
  for (const f of filas || []) {
    const g = new Map();
    for (const p of f.piezas) {
      const c = p.meta.n.cal ?? "?";
      if (!g.has(c)) g.set(c, { cal: c, piezas: 0, area: 0, sinContar: 0, dibujos: 0 });
      const x = g.get(c); x.dibujos++;
      if (p.res.sev === "err" || p.res.sev === "info") x.sinContar += p.total;
      else { x.piezas += p.total; x.area += (p.res.area || 0) * p.total; }
    }
    for (const x of [...g.values()].sort((a, b) => (a.cal === "?") - (b.cal === "?") || a.cal - b.cal)) {
      const t = ESPESOR[x.cal];
      out.push({ f, ...x, kg: t ? x.area * t * DENS : 0, hojas: x.area / AREA_HOJA });
    }
  }
  return out;
}

function abrirPieza(id) {
  let meta = null;
  for (const r of S.biblio.rutas.values()) { meta = r.clas.vig.find(m => m.id === id); if (meta) break; }
  if (!meta) return;
  const res = resultadoPieza(meta);
  $("#dlgT").textContent = `${meta.n.prefijo} · ${meta.n.pieza} · CAL ${meta.n.cal ?? "?"} · v${meta.n.version}`;
  $("#dlgC").innerHTML = svgPieza(res, true);
  $("#dlgF").innerHTML = `${res.bbox ? `<b>${fmt(res.ancho, 2)} × ${fmt(res.alto, 2)} mm</b> · ` : ""}${res.area ? `área neta ${fmt(res.area * 1e6, 0)} mm² · ${res.lazos} contornos (${res.barrenos} interiores) · corte ${fmt(res.perimCorte, 0)} mm · marca ${fmt(res.largoMarca, 0)} mm` : ""}

const EXCELJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
function cargarExcelJS() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  return new Promise((res, rej) => {
    const sc = document.createElement("script"); sc.src = EXCELJS_URL;
    sc.onload = () => window.ExcelJS ? res(window.ExcelJS) : rej(new Error("No se cargó ExcelJS"));
    sc.onerror = () => rej(new Error("No se pudo cargar la librería de Excel (revisa la conexión a internet)"));
    document.head.appendChild(sc);
  });
}

/** Acción sugerida para Ingeniería según el problema */
function accionSugerida(txt) {
  const t = norm(txt);
  const R = [
    [/ABIERTO/, "Cerrar el contorno: unir los extremos sueltos (las líneas deben tocarse) y subir nueva versión"],
    [/DUPLICAD|ENCIMAD/, "Borrar las líneas encimadas (OVERKILL en AutoCAD) y subir nueva versión"],
    [/EXTERIORES INDEPENDIENTES/, "Dejar una sola pieza por archivo; separar las demás en archivos propios"],
    [/NO CABE/, "Revisar escala/unidades del dibujo; la pieza excede la lámina 4×10"],
    [/PULGADAS|UNIDADES/, "Exportar el DXF en milímetros"],
    [/NINGUNA CAPA|CONTORNO CERRADO/, "Revisar que el contorno exterior esté completo y cerrado"],
    [/TEXTO/, "Convertir el texto a trazos (explotar) o eliminarlo"],
    [/BLOQUE|INSERT/, "Explotar los bloques (EXPLODE) antes de exportar"],
    [/COTA/, "Eliminar cotas y anotaciones del DXF de corte"],
    [/ACHURADO|HATCH/, "Eliminar achurados del DXF de corte"],
    [/FUERA DEL RANGO/, "Confirmar el calibre: el láser de cama corta cal 12 a 24"],
    [/SIN CALIBRE/, "Agregar CALxx al nombre del archivo"],
    [/ARCHIVOS V\d|FECHA MAS RECIENTE/, "Renombrar el archivo correcto a la siguiente versión (v2, v3…) y conservar el anterior como respaldo"],
    [/EMPIEZA CON/, "Corregir el prefijo del nombre o mover el archivo a la carpeta de su ruta"],
    [/SIN NUMERO DE VERSION/, "Agregar la versión al nombre: … vN (AAAA-MM-DD).dxf"],
    [/CONVENCION/, "Renombrar: RUTA_NPZAS_LAMINA_CALxx_PIEZA vN (AAAA-MM-DD).dxf"],
    [/MATERIAL/, "Mover el archivo a la carpeta de su material"],
    [/NO TIENE CARPETA|NO TIENE DIBUJOS/, "Subir los DXF de lámina de esta ruta o confirmar que no lleva piezas de láser de cama"],
    [/DESCARGAR|LEER EL DXF/, "Revisar que el archivo abra en AutoCAD y volver a subirlo"],
  ];
  const m = R.find(([rx]) => rx.test(t));
  return m ? m[1] : "Revisar el dibujo";
}

async function exportarExcel(filas, L) {
  let ExcelJS;
  try { ExcelJS = await cargarExcelJS(); } catch (e) { return alert(e.message); }
  const C = { verde: "FF2F7D32", verdeCl: "FFE6F2E4", rojo: "FFB3261E", rojoCl: "FFFBE5E2", ambar: "FF9A6A00", ambarCl: "FFFBF1D6",
              gris: "FF55606B", grisCl: "FFECEFF1", linea: "FFD6DAD2", banda: "FFF6F7F4", blanco: "FFFFFFFF", tinta: "FF1C1F1A" };
  const wb = new ExcelJS.Workbook(); wb.creator = "Nidos Láser de Cama"; wb.created = new Date();
  const ahora = new Date(), fechaTxt = ahora.toLocaleString("es-MX", { dateStyle: "long", timeStyle: "short" });
  const borde = { top: { style: "thin", color: { argb: C.linea } }, bottom: { style: "thin", color: { argb: C.linea } }, left: { style: "thin", color: { argb: C.linea } }, right: { style: "thin", color: { argb: C.linea } } };
  const fill = argb => ({ type: "pattern", pattern: "solid", fgColor: { argb } });

  /** Hoja con título, subtítulo, encabezado con filtro y paneles fijos */
  function hoja(nombre, titulo, cols, color = C.verde) {
    const ws = wb.addWorksheet(nombre, { views: [{ state: "frozen", ySplit: 4, showGridLines: false }], properties: { tabColor: { argb: color } },
      pageSetup: { orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: .4, right: .4, top: .5, bottom: .5, header: .2, footer: .2 } } });
    ws.columns = cols.map(c => ({ key: c.k, width: c.w }));
    ws.mergeCells(1, 1, 1, cols.length);
    Object.assign(ws.getCell(1, 1), { value: titulo });
    ws.getCell(1, 1).font = { bold: true, size: 15, color: { argb: C.tinta } };
    ws.getRow(1).height = 24;
    ws.mergeCells(2, 1, 2, cols.length);
    ws.getCell(2, 1).value = `Generado ${fechaTxt}${S.programa ? " · Programa: " + S.programa.nombre : ""}${S.biblio ? " · Biblioteca: " + S.biblio.raiz : ""}`;
    ws.getCell(2, 1).font = { size: 9, italic: true, color: { argb: C.gris } };
    const h = ws.getRow(4);
    cols.forEach((c, i) => {
      const cell = h.getCell(i + 1); cell.value = c.t;
      cell.font = { bold: true, color: { argb: C.blanco }, size: 10 }; cell.fill = fill(color); cell.border = borde;
      cell.alignment = { vertical: "middle", horizontal: c.num ? "right" : "left", wrapText: true };
    });
    h.height = 30;
    ws.autoFilter = { from: { row: 4, column: 1 }, to: { row: 4, column: cols.length } };
    ws.headerFooter.oddFooter = "&L" + titulo + "&RPágina &P de &N";
    ws.pageSetup.printTitlesRow = "4:4";
    return ws;
  }
  function filaDatos(ws, valores, cols, opts = {}) {
    const r = ws.addRow(valores);
    r.eachCell({ includeEmpty: true }, (cell, i) => {
      const c = cols[i - 1]; if (!c) return;
      cell.border = borde; cell.font = { size: 10, color: { argb: C.tinta }, ...(c.mono ? { name: "Consolas" } : {}), ...(opts.bold ? { bold: true } : {}) };
      cell.alignment = { vertical: "top", horizontal: c.num ? "right" : c.centro ? "center" : "left", wrapText: !!c.wrap };
      if (c.fmt) cell.numFmt = c.fmt;
      if (opts.banda) cell.fill = fill(C.banda);
      if (opts.fondo) cell.fill = fill(opts.fondo);
    });
    return r;
  }

  /* ---------- Resumen ---------- */
  const sevInfo = { err: ["❌ Error", C.rojo, C.rojoCl, "Bloquea el anidado: corregir antes de producir"], warn: ["⚠️ Aviso", C.ambar, C.ambarCl, "Se puede anidar, pero conviene corregir"], info: ["📂 Falta dibujo", C.gris, C.grisCl, "La ruta del programa no tiene DXF de lámina"] };
  const res = wb.addWorksheet("Resumen", { views: [{ showGridLines: false }], properties: { tabColor: { argb: C.verde } },
    pageSetup: { orientation: "portrait", fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: .5, right: .5, top: .5, bottom: .5, header: .2, footer: .2 } } });
  res.columns = [{ width: 22 }, { width: 14 }, { width: 14 }, { width: 58 }];
  res.mergeCells("A1:D1"); res.getCell("A1").value = "Pendientes de la biblioteca de corte · Láser de cama"; res.getCell("A1").font = { bold: true, size: 16 };
  res.mergeCells("A2:D2"); res.getCell("A2").value = `Generado ${fechaTxt}`; res.getCell("A2").font = { size: 9, italic: true, color: { argb: C.gris } };
  let rr = 4;
  const kv = (k, v) => { res.getCell(rr, 1).value = k; res.getCell(rr, 1).font = { bold: true, size: 10 }; res.getCell(rr, 2).value = v; res.getCell(rr, 2).font = { size: 10 }; res.mergeCells(rr, 2, rr, 4); rr++; };
  kv("Programa", S.programa ? `${S.programa.nombre} · ${S.programa.ops.length} OPs` : "—");
  kv("Biblioteca", S.biblio ? S.biblio.raiz : "—");
  rr++;
  ["Severidad", "En programa", "Total", "Qué significa"].forEach((t, i) => { const c = res.getCell(rr, i + 1); c.value = t; c.font = { bold: true, color: { argb: C.blanco } }; c.fill = fill(C.verde); c.border = borde; });
  rr++;
  for (const k of ["err", "warn", "info"]) {
    const [t, col, cl, desc] = sevInfo[k];
    const vals = [t, L.filter(x => x.sev === k && x.prog).length, L.filter(x => x.sev === k).length, desc];
    vals.forEach((v, i) => { const c = res.getCell(rr, i + 1); c.value = v; c.border = borde; c.font = { size: 10, bold: i === 0, color: { argb: i === 0 ? col : C.tinta } }; c.fill = fill(cl); c.alignment = { horizontal: i === 1 || i === 2 ? "center" : "left", vertical: "middle", wrapText: i === 3 }; });
    rr++;
  }
  rr++;
  const porRuta = new Map();
  for (const x of L) { if (!porRuta.has(x.ruta)) porRuta.set(x.ruta, { ruta: x.ruta, err: 0, warn: 0, info: 0, prog: x.prog }); porRuta.get(x.ruta)[x.sev]++; }
  const rutasOrd = [...porRuta.values()].sort((a, b) => (b.prog - a.prog) || (b.err - a.err) || (b.warn - a.warn) || a.ruta.localeCompare(b.ruta, "es", { numeric: true }));
  res.getCell(rr, 1).value = "Rutas con pendientes (primero las del programa)"; res.getCell(rr, 1).font = { bold: true, size: 12 }; rr++;
  ["Ruta", "❌ Errores", "⚠️ Avisos", "En programa"].forEach((t, i) => { const c = res.getCell(rr, i + 1); c.value = t; c.font = { bold: true, color: { argb: C.blanco } }; c.fill = fill(C.verde); c.border = borde; c.alignment = { horizontal: i ? "center" : "left" }; });
  rr++;
  for (const r of rutasOrd.filter(r => r.err || r.warn)) {
    [r.ruta, r.err || "", r.warn || "", r.prog ? "Sí" : "No"].forEach((v, i) => { const c = res.getCell(rr, i + 1); c.value = v; c.border = borde; c.font = { size: 10, name: i === 0 ? "Consolas" : undefined, bold: i === 0, color: { argb: i === 1 && v ? C.rojo : i === 2 && v ? C.ambar : C.tinta } }; c.alignment = { horizontal: i ? "center" : "left" }; if (r.prog) c.fill = fill(C.verdeCl); });
    rr++;
  }
  if (!rutasOrd.some(r => r.err || r.warn)) { res.getCell(rr, 1).value = "✅ Sin errores ni avisos en los dibujos revisados"; rr++; }

  /* ---------- Pendientes ---------- */
  const colsP = [{ k: "n", t: "#", w: 5, centro: true }, { k: "sev", t: "Severidad", w: 14 }, { k: "ruta", t: "Ruta", w: 20, mono: true }, { k: "prog", t: "En programa", w: 10, centro: true },
    { k: "pieza", t: "Pieza / mueble", w: 30 }, { k: "cal", t: "Cal.", w: 6, centro: true }, { k: "ver", t: "Ver.", w: 6, centro: true },
    { k: "prob", t: "Problema detectado", w: 52, wrap: true }, { k: "acc", t: "Qué hacer", w: 50, wrap: true }, { k: "arch", t: "Archivo", w: 58, wrap: true, mono: true }];
  const wsP = hoja("Pendientes", "Pendientes para Ingeniería · DXF de lámina", colsP);
  if (!L.length) filaDatos(wsP, { n: "", sev: "✅", prob: "Sin pendientes: todos los dibujos revisados cumplen" }, colsP);
  let rutaPrev = null, banda = false;
  L.forEach((x, i) => {
    if (x.ruta !== rutaPrev) { banda = !banda; rutaPrev = x.ruta; }
    const n = x.archivo ? leerNombre(x.archivo) : null;
    const r = filaDatos(wsP, { n: i + 1, sev: sevInfo[x.sev][0], ruta: x.ruta, prog: x.prog ? "Sí" : "No", pieza: n ? n.pieza : (x.desc || ""), cal: n && n.cal != null ? n.cal : "",

    const cs = r.getCell("sev"); cs.fill = fill(sevInfo[x.sev][2]); cs.font = { bold: true, size: 10, color: { argb: sevInfo[x.sev][1] } };
    if (x.prog) { const cp = r.getCell("prog"); cp.font = { bold: true, size: 10, color: { argb: C.verde } }; }
    r.getCell("arch").font = { name: "Consolas", size: 8.5, color: { argb: C.gris } };
  });

  if (filas) {
    /* ---------- Consumo por OP ---------- */
    const colsC = [{ k: "op", t: "OP", w: 13, mono: true }, { k: "ruta", t: "Ruta", w: 13, mono: true }, { k: "desc", t: "Descripción", w: 38, wrap: true }, { k: "cant", t: "Muebles", w: 9, num: true, fmt: "#,##0" },
      { k: "cal", t: "Calibre", w: 8, centro: true }, { k: "pz", t: "Piezas", w: 9, num: true, fmt: "#,##0" }, { k: "area", t: "Área neta m²", w: 12, num: true, fmt: "#,##0.000" },

    const wsC = hoja("Consumo por OP", "Consumo neto de lámina por OP", colsC);

    }
    if (CON.length) {
      const a = 5, b = 4 + CON.length;

      t.getCell("op").font = { bold: true, size: 10 };
    } else filaDatos(wsC, { op: "Sin piezas de lámina en el programa" }, colsC);

    /* ---------- Explosión ---------- */
    const colsE = [{ k: "cal", t: "Calibre", w: 9, centro: true }, { k: "esp", t: "Espesor mm", w: 11, num: true, fmt: "0.00" }, { k: "ops", t: "OPs", w: 7, num: true }, { k: "dib", t: "Dibujos", w: 9, num: true },
      { k: "pz", t: "Piezas", w: 9, num: true, fmt: "#,##0" }, { k: "area", t: "Área neta m²", w: 13, num: true, fmt: "#,##0.000" }, { k: "kg", t: "Kg netos", w: 11, num: true, fmt: "#,##0.00" },
      { k: "hojas", t: "Láminas mín. teóricas", w: 14, num: true, fmt: "0.000" }, { k: "mc", t: "Metros de corte", w: 12, num: true, fmt: "#,##0.0" }, { k: "err", t: "Piezas sin contar (error)", w: 14, num: true }];
    const wsE = hoja("Explosión", "Explosión de lámina por calibre (mínimo teórico)", colsE);
    const EX = explosion(filas);
    EX.forEach((g, i) => { const t = ESPESOR[g.cal]; filaDatos(wsE, { cal: g.cal, esp: t || "", ops: g.ops.size, dib: g.refs.size, pz: g.piezas, area: g.area, kg: t ? g.area * t * DENS : "", hojas: g.area / AREA_HOJA, mc: g.corte / 1000, err: g.errores || "" }, colsE, { banda: i % 2 === 1 }); });
    if (EX.length) { const a = 5, b = 4 + EX.length; filaDatos(wsE, { cal: "TOTAL", pz: { formula: `SUBTOTAL(9,E${a}:E${b})` }, area: { formula: `SUBTOTAL(9,F${a}:F${b})` }, kg: { formula: `SUBTOTAL(9,G${a}:G${b})` }, hojas: { formula: `SUBTOTAL(9,H${a}:H${b})` }, mc: { formula: `SUBTOTAL(9,I${a}:I${b})` } }, colsE, { bold: true, fondo: C.verdeCl }); }

    /* ---------- Detalle por OP ---------- */
    const colsD = [{ k: "op", t: "OP", w: 13, mono: true }, { k: "ruta", t: "Ruta", w: 13, mono: true }, { k: "desc", t: "Descripción", w: 36, wrap: true }, { k: "cant", t: "Muebles", w: 9, num: true },
      { k: "pieza", t: "Pieza", w: 26 }, { k: "cal", t: "Calibre", w: 8, centro: true }, { k: "pzm", t: "Pz/mueble", w: 10, num: true }, { k: "tot", t: "Piezas totales", w: 11, num: true, fmt: "#,##0" },
      { k: "est", t: "Estado", w: 18 }, { k: "arch", t: "Archivo", w: 58, mono: true, wrap: true }];
    const wsD = hoja("Detalle por OP", "Detalle de piezas por OP", colsD);
    const estC = { OK: [C.verde, C.verdeCl], Aviso: [C.ambar, C.ambarCl], Error: [C.rojo, C.rojoCl] };
    prevF = null; banda = false;
    for (const f of filas) {
      banda = !banda;
      const filasOp = f.piezas.length ? f.piezas.map(q => ({ pieza: q.meta.n.pieza, cal: q.meta.n.cal, pzm: q.meta.n.pz, tot: q.total, est: { ok: "OK", warn: "Aviso", err: "Error", info: "Sin validar" }[q.res.sev], arch: q.meta.nombre }))
                                        : [{ est: f.etiqueta }];
      for (const d of filasOp) {
        const r = filaDatos(wsD, { op: f.op.op, ruta: f.op.ruta, desc: f.op.desc, cant: f.op.cant, ...d }, colsD, { banda });
        const e = estC[d.est]; if (e) { r.getCell("est").font = { bold: true, size: 10, color: { argb: e[0] } }; r.getCell("est").fill = fill(e[1]); }
        else r.getCell("est").font = { size: 10, italic: true, color: { argb: C.gris } };
        r.getCell("arch").font = { name: "Consolas", size: 8.5, color: { argb: C.gris } };
      }
    }
  }

  const buf = await wb.xlsx.writeBuffer();
  const url = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  const a = document.createElement("a"); a.href = url; a.download = `Pendientes_Ingenieria_laser_${ahora.toISOString().slice(0, 10)}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ============================== EVENTOS ============================== */
function syncCfg() {
  const url = ls.get("nl_url", "") || URL_DEFAULT;
  $("#iUrl").value = url; $("#iTok").value = ls.get("nl_tok", "");
  $("#cfgSub").textContent = url ? "Apps Script configurado" : "sin configurar — abre para pegar la URL";
  if (!url) $("#cfgCard").open = true;
}
$("#iUrl").onchange = e => { ls.set("nl_url", e.target.value.trim()); syncCfg(); };
$("#iTok").onchange = e => { ls.set("nl_tok", e.target.value); };
$("#bPing").onclick = async () => {
  $("#pingRes").textContent = "Probando…";
  try { const d = await jsonp({ accion: "ping" }, 60000); $("#pingRes").textContent = "✅ Conectado a: " + d.raiz + (d.metodo ? " · " + d.metodo : ""); }
  catch (e) { $("#pingRes").textContent = "❌ " + e.message; }
};
$("#bCache").onclick = async () => { await idb.clear(); S.analisis.clear(); estado("Caché limpia"); render(); };

$("#fProg").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    S.programa = leerPrograma(new Uint8Array(await f.arrayBuffer()), f.name);
    estado(`Programa: ${S.programa.ops.length} OPs`);
    if (S.biblio) await analizarPrograma();
  } catch (err) { alert("Programa: " + err.message); }
  e.target.value = ""; render();
};

async function analizarPrograma() {
  if (!S.programa || !S.biblio) return;
  const metas = [];
  for (const op of S.programa.ops) { const r = S.biblio.rutas.get(norm(op.ruta)); if (r) metas.push(...r.clas.vig); }
  await analizarArchivos([...new Map(metas.map(m => [m.id, m])).values()], "Revisando dibujos del programa");
}

$("#bLeer").onclick = async () => {
  const b = $("#bLeer"); b.disabled = true;
  try {
    progreso("Leyendo la biblioteca en Drive…", 0.05);
    const refrescar = !!S.biblio && S.biblio.origen === "drive";
    S.analisis.clear();
    await cargarListado(refrescar);
    estado(`Biblioteca: ${S.biblio.rutas.size} rutas`);
    await analizarPrograma();
    progreso(null);
  } catch (e) { progreso(null); alert(e.message); }
  b.disabled = false; render();
};

$("#fLocal").onchange = async e => {
  const files = [...e.target.files]; if (!files.length) return;
  const rutas = new Map(); S.local.clear(); S.analisis.clear();
  for (const f of files) {
    const id = "local:" + f.name + ":" + f.size;
    S.local.set(id, new Uint8Array(await f.arrayBuffer()));
    const n = leerNombre(f.name), ruta = n ? n.prefijo : "(sin ruta)";
    if (!rutas.has(norm(ruta))) rutas.set(norm(ruta), { ruta, tieneLamina: true, archivos: [] });
    rutas.get(norm(ruta)).archivos.push({ id, nombre: f.name, mod: new Date(f.lastModified).toISOString(), kb: Math.round(f.size / 1024) });
  }
  S.biblio = { origen: "local", raiz: "Archivos locales", generado: new Date().toISOString(), rutas };
  for (const r of rutas.values()) r.clas = clasificarRuta(r);
  await analizarArchivos([...rutas.values()].flatMap(r => r.clas.vig), "Revisando archivos locales");
  e.target.value = ""; estado(`Modo local: ${files.length} archivos`); render();
};

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  for (const s of ["ops", "exp", "con", "pen", "bib"]) $("#t-" + s).classList.toggle("hide", s !== t.dataset.t);
  ls.set("nl_tab", t.dataset.t);
});
$("#bTema").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nuevo = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nuevo; ls.set("nl_tema", nuevo);
};
$("#dlgX").onclick = () => $("#dlg").close();
$("#dlg").onclick = e => { if (e.target.id === "dlg") $("#dlg").close(); };

(function init() {
  const t = ls.get("nl_tema", ""); if (t) document.documentElement.dataset.theme = t;
  syncCfg();
  const tab = ls.get("nl_tab", "ops"); const bt = document.querySelector(`.tab[data-t="${tab}"]`); if (bt) bt.click();
  render();
})();
</script>
</body>
